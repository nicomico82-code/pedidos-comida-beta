services:
  worker:
    build: .
    command: npx wrangler dev --config wrangler.jsonc --local --ip 0.0.0.0 --port 8787
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - wrangler_state:/app/.wrangler

  admin:
    build: .
    command: npx wrangler dev --config wrangler.admin.jsonc --local --ip 0.0.0.0 --port 8788
    ports:
      - "8788:8788"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - wrangler_state:/app/.wrangler

  web:
    build: .
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - worker
      - admin

volumes:
  node_modules:
  wrangler_state:
